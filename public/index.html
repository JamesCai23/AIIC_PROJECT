<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AIIC Chatbot</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>AIIC Chatbot</h1>
      <p class="subtitle">Powered by OpenRouter</p>
    </header>
    <main>
      <div id="chat" class="chat">
        <div class="message bot">
          <div class="avatar">🤖</div>
          <div class="bubble">Hello! I'm an AI assistant. How can I help you today?</div>
        </div>
      </div>
      <form id="form" class="input-area">
        <textarea id="input" rows="1" placeholder="Type your message..." autofocus></textarea>
        <button type="submit" id="send-btn" aria-label="Send message">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </form>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
